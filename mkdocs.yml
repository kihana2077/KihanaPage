site_name: Kihana's Blog
site_description: Kihana的个人博客
site_author: Kihana
site_url: https://blog.kihana.asia/
repo_url: https://github.com/kihana2077/KihanaPage
repo_name: KihanaPage

theme:
  name: material
  custom_dir: overrides  
  language: zh
  font: 
    text: Noto Sans SC
    code: JetBrains Mono
  logo: assets/favicon.ico
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 亮色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 暗色模式
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
    - search.share
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - toc.follow
    - tags


plugins:
  - search
  - git-revision-date-localized:
      type: date
      timezone: Asia/Shanghai
      locale: zh
      enable_creation_date: true
      custom_format: "%Y-%m-%d %H:%M"
      exclude: 
          - index.md
          - friend.md
          - tags.md
          - toc.md
      strict: true
  - statistics
  - blogging:
      locale: zh_CN
      dirs:
        - blog
      sort:
        from: new
        by: creation
      size: 10
      show_total: false
      time_format: '%Y-%m-%d'
      features:
        tags:
          index_page: tags.md
      template: overrides/blog-card.html
  - tags:
      tags: false
  # - document-dates:
  #     position: top            # 显示位置：top（标题后） bottom（文档末尾）
  #     type: datetime               # 时间类型：date datetime timeago，默认：date
  #     exclude:                 # 排除文件列表
  #       - temp.md              # 排除指定文件
  #       - drafts/*             # 排除 drafts 目录下所有文件，包括子目录
  #     locale: zh               # 本地化语言：en zh zh_TW es fr de ar ja ko ru，默认：en
  #     date_format: '%Y-%m-%d'  # 日期格式化字符串，例如：%Y年%m月%d日、%b %d, %Y
  #     time_format: '%H:%M'  # 时间格式化字符串（仅在 type=datetime 时有效）
  #     show_author: true        # 是否显示作者信息，默认：true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true


# nav: 
#   - 首页: index.md
#   - 留言板: contact.md
#   - 友链: friend.md
#   - 标签: tags.md
#   - Blog: 
#       - 正则表达式 语法: 正则.md
#       - Markdown语法: 使用Markdown.md
#       - Admonition扩展语法: material.md
#       - Github Pages文档自动化部署: first.md
#       - 我的第一篇博客: 我的第一篇博客.md


markdown_extensions:
      - abbr
      - attr_list
      - admonition
      - def_list
      - footnotes
      - md_in_html
      - meta # 支持Markdown文件上方自定义标题标签等
      - pymdownx.caret
      - pymdownx.betterem
      - pymdownx.critic
      - pymdownx.details
      - pymdownx.inlinehilite
      - pymdownx.keys
      - pymdownx.mark
      - pymdownx.snippets
      - pymdownx.smartsymbols
      - pymdownx.tilde
      - pymdownx.superfences:
          custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format # 代码块高亮插件
      - pymdownx.arithmatex:  # latex支持
          generic: true
      - toc:
          permalink: "#" # 使用普通字符，避免图标字体缺字显示为方框
          toc_depth: 3
          slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
      - pymdownx.highlight: # 代码块高亮
          anchor_linenums: true
          linenums: true # 显示行号
          auto_title: true # 显示编程语言名称
      - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
      - pymdownx.tabbed:
          alternate_style: true
      - pymdownx.tasklist:
          custom_checkbox: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/custom.css
  - stylesheets/theme.css
  - https://cdn.jsdelivr.net/npm/sakana-widget@latest/lib/sakana.min.css

extra_javascript:
  # - javascripts/extra.js
  - javascript/background.js
  - javascript/mathjax.js
  - javascript/extras.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/sakana-widget@latest/lib/sakana.min.js
hooks:
  - overrides/hooks/rss.py


